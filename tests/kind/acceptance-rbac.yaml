# ServiceAccount + namespaced Role for the acceptance runner Job.
# Least privilege: read workloads/pods and scale Deployments/StatefulSets (fault injection),
# pause KEDA ScaledObjects - in namespace "affogato" only. No ClusterRole, no secrets
# access, no exec, no delete.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-acceptance
  namespace: affogato
  labels: {app.kubernetes.io/name: af-acceptance, app.kubernetes.io/part-of: affogato-tests}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: af-acceptance
  namespace: affogato
  labels: {app.kubernetes.io/name: af-acceptance, app.kubernetes.io/part-of: affogato-tests}
rules:
  # Read workloads (replica counts, env such as WHISPER_MODEL / FINALIZE_IDLE_TIMEOUT, rollout status).
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Fault injection: kubectl scale --replicas=N.
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  # Readiness waits, restart counts, pod IPs for /metrics scraping.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Keep KEDA from undoing a scale-to-zero: annotate autoscaling.keda.sh/paused-replicas.
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: af-acceptance
  namespace: affogato
  labels: {app.kubernetes.io/name: af-acceptance, app.kubernetes.io/part-of: affogato-tests}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: af-acceptance
subjects:
  - kind: ServiceAccount
    name: af-acceptance
    namespace: affogato
