# In-cluster acceptance run. Applied by tests/kind/run-job.sh, which substitutes
# __JOB_NAME__, __IMAGE__, __GODOG_TAGS__ and __GODOG_STRICT__.
#
# TODO(chart): service names, ports and the MinIO secret below are placeholders until
# deploy/helm/affogato exists; align them with values-kind.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: affogato
  labels: {app.kubernetes.io/name: af-acceptance, app.kubernetes.io/part-of: affogato-tests}
spec:
  backoffLimit: 0                 # a failed run is a result, never retried
  # Budget (kind values: FINALIZE_IDLE_TIMEOUT=10s, sweep 2s, testFaults.enabled): ~35 min for
  # all non-@load scenarios. Long ones: F4.2 AI crash loop ~6 min (5 x (ack_wait 60 s +
  # restart)), F4.1 ~2 min of AI backoff (2+10+30+60 s) plus Qdrant scale down/up, F4.3
  # ~4 min, F6 Background (8 speech chunks, per scenario) ~8 min in total. The deadline sits
  # above -test.timeout so AfterSuite can still restore scaled workloads.
  activeDeadlineSeconds: 3300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: af-acceptance, app.kubernetes.io/part-of: affogato-tests}
    spec:
      serviceAccountName: af-acceptance
      restartPolicy: Never
      terminationGracePeriodSeconds: 120   # let AfterSuite restore scaled-down workloads
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: acceptance
          image: __IMAGE__
          imagePullPolicy: IfNotPresent   # image is side-loaded with `kind load docker-image`
          args: ["-test.run", "^TestFeatures$", "-test.v", "-test.timeout", "50m"]
          env:
            - {name: GODOG_TAGS, value: "__GODOG_TAGS__"}
            - {name: GODOG_STRICT, value: "__GODOG_STRICT__"}
            - {name: GODOG_FORMAT, value: "pretty,junit:/reports/junit.xml"}
            - {name: NO_COLOR, value: "1"}
            - {name: AF_KUBE_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: AF_NATS_URL, value: "nats://affogato-nats:4222"}
            - {name: AF_MINIO_ENDPOINT, value: "affogato-minio:9000"}
            # Must equal the Serving API's MINIO_PUBLIC_ENDPOINT (presigned URL host check).
            - {name: AF_MINIO_PUBLIC_ENDPOINT, value: "http://localhost:9000"}
            - {name: AF_MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: affogato-minio, key: rootUser}}}
            - {name: AF_MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: affogato-minio, key: rootPassword}}}
            - {name: AF_QDRANT_URL, value: "http://affogato-qdrant:6333"}
            - {name: AF_API_BASE_URL, value: "http://affogato-serving-api:8080"}
            - {name: AF_FIXTURES_DIR, value: "/fixtures"}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: reports, mountPath: /reports}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
        - {name: reports, emptyDir: {sizeLimit: 64Mi}}
