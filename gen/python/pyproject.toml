# Distribution for the generated Python contracts. src/ is generated by `make contracts-gen`;
# this file is maintained by hand and must match the plugin versions in buf.gen.yaml.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "affogato-contracts"
version = "0.1.0"
description = "Generated protobuf types for the Affogato contracts (proto/affogato/*/v1). Do not edit."
readme = "README.md"
requires-python = ">=3.10"
# protocolbuffers/python v36.2 emits gencode for runtime 7.36.2; the gencode refuses older runtimes.
dependencies = ["protobuf>=7.36.2,<8"]

[tool.hatch.build.targets.wheel]
# `affogato` and its subpackages are implicit namespace packages (the plugin writes no __init__.py).
packages = ["src/affogato"]
