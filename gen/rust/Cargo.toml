# Prost types for the Affogato contracts. src/ is generated by `make contracts-gen`; this
# manifest is maintained by hand and must match the plugin versions in buf.gen.yaml.
[package]
name = "af-proto"
version = "0.1.0"
edition = "2021"
description = "Generated prost types for the Affogato contracts (proto/affogato/*/v1). Do not edit."
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# neoeinstein-prost v0.5.0 generates code for prost 0.14.1.
bytes = "1"
prost = "0.14.1"
prost-types = "0.14.1"
